<!doctype html>
<html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pump Icons</title>
<style>
:root{--canvas:#fffaf2;--text:#20213b;--cell:#e8f0fc;--size:256px}*{box-sizing:border-box}body{margin:0;padding:32px;background:var(--canvas);color:var(--text);font:16px system-ui,sans-serif}h1{margin:0 0 8px}p{margin:0 0 20px}button,select{font:inherit;padding:8px 12px;border:2px solid #20213b;border-radius:10px;background:#fff;color:#20213b}header{margin-bottom:24px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(calc(var(--size) + 32px),1fr));gap:18px}article{border:2px solid #20213b;border-radius:18px;background:var(--cell);text-align:center;padding:16px}img{display:block;margin:auto;width:var(--size);height:var(--size);object-fit:contain}article div{margin-top:10px;font-weight:600}a{display:inline-block;margin-top:8px;color:var(--text)}body.dark{--canvas:#171827;--text:#faf6e9;--cell:#303248}
</style><header><h1>Pump Icons</h1><p>8 icon PNG · 1254 × 1254 · nền trong suốt</p><button id="theme">Đổi nền sáng / tối</button> <label>Kích thước xem <select id="size"><option>64</option><option>128</option><option selected>256</option><option>384</option></select> px</label></header>
<main class="grid">
<article><img src="HandPump.png" alt="Hand Pump" width="256" height="256"><div>1. Hand Pump</div><a href="HandPump.png" download>Tải PNG</a></article>
<article><img src="FootPump.png" alt="Foot Pump" width="256" height="256"><div>2. Foot Pump</div><a href="FootPump.png" download>Tải PNG</a></article>
<article><img src="DoublePump.png" alt="Double Pump" width="256" height="256"><div>3. Double Pump</div><a href="DoublePump.png" download>Tải PNG</a></article>
<article><img src="AirCompressor.png" alt="Air Compressor" width="256" height="256"><div>4. Air Compressor</div><a href="AirCompressor.png" download>Tải PNG</a></article>
<article><img src="TurboCompressor.png" alt="Turbo Compressor" width="256" height="256"><div>5. Turbo Compressor</div><a href="TurboCompressor.png" download>Tải PNG</a></article>
<article><img src="JetPump.png" alt="Jet Pump" width="256" height="256"><div>6. Jet Pump</div><a href="JetPump.png" download>Tải PNG</a></article>
<article><img src="StormPump.png" alt="Storm Pump" width="256" height="256"><div>7. Storm Pump</div><a href="StormPump.png" download>Tải PNG</a></article>
<article><img src="HurricanePump.png" alt="Hurricane Pump" width="256" height="256"><div>8. Hurricane Pump</div><a href="HurricanePump.png" download>Tải PNG</a></article>
</main><script>document.getElementById('theme').onclick=()=>document.body.classList.toggle('dark');document.getElementById('size').onchange=e=>document.documentElement.style.setProperty('--size',e.target.value+'px');</script></html>
