<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crates Icons</title><style>:root{--bg:#fffaf2;--fg:#20213b;--tile:#e8f0fc;--size:192px}*{box-sizing:border-box}body{margin:0;padding:28px;background:var(--bg);color:var(--fg);font:16px system-ui,sans-serif}h1{margin:0 0 8px}p{margin:0 0 20px}button,select,input{font:inherit;padding:8px 12px;border:2px solid #20213b;border-radius:10px;background:#fff;color:#20213b}header{margin-bottom:24px}.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(calc(var(--size) + 32px),1fr));gap:18px}article{border:2px solid #20213b;border-radius:18px;background:var(--tile);text-align:center;padding:16px}img{display:block;margin:auto;width:var(--size);height:var(--size);object-fit:contain}article div{margin-top:10px;font-weight:650}article small{display:block;margin:6px 0;color:var(--fg)}a{color:var(--fg)}body.dark{--bg:#171827;--fg:#faf6e9;--tile:#303248}[hidden]{display:none!important}</style>
<header><h1>Crates Icons</h1><p>4 ảnh PNG · 1254 × 1254 · nền trong suốt · <a href="../Cargo/index.html">Xem Cargo</a></p>
<div class="controls"><button id="theme">Đổi nền sáng / tối</button><label>Kích thước <select id="size"><option>64</option><option>128</option><option selected>192</option><option>256</option><option>384</option></select> px</label><input id="search" placeholder="Tìm icon…" aria-label="Tìm icon"></div></header><main class="grid">
<article data-name="basic crate" data-rarity=""><img src="BasicCrate.png" alt="Basic Crate" width="192" height="192"><div>Basic Crate</div><a href="BasicCrate.png" download>Tải PNG</a></article>
<article data-name="sky crate" data-rarity=""><img src="SkyCrate.png" alt="Sky Crate" width="192" height="192"><div>Sky Crate</div><a href="SkyCrate.png" download>Tải PNG</a></article>
<article data-name="space crate" data-rarity=""><img src="SpaceCrate.png" alt="Space Crate" width="192" height="192"><div>Space Crate</div><a href="SpaceCrate.png" download>Tải PNG</a></article>
<article data-name="cosmic crate" data-rarity=""><img src="CosmicCrate.png" alt="Cosmic Crate" width="192" height="192"><div>Cosmic Crate</div><a href="CosmicCrate.png" download>Tải PNG</a></article>
</main><script>
document.getElementById('theme').onclick=()=>document.body.classList.toggle('dark');
document.getElementById('size').onchange=e=>document.documentElement.style.setProperty('--size',e.target.value+'px');
function filter(){const q=document.getElementById('search').value.trim().toLowerCase(),r=document.getElementById('rarity')?.value||'';document.querySelectorAll('article').forEach(e=>e.hidden=!e.dataset.name.includes(q)||(r&&e.dataset.rarity!==r));}
document.getElementById('search').oninput=filter;const rarity=document.getElementById('rarity');if(rarity)rarity.onchange=filter;
</script></html>
